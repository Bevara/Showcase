# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinned, not ubuntu-latest: gpac was removed from the Ubuntu archive after
    # 24.04 (it is absent from 25.10 onwards, so from 26.04 LTS too), and
    # ubuntu-latest now resolves to 26.04. 24.04 still ships gpac 2.2.1, which
    # provides the MP4Box used by get_testing_files.sh. When 24.04 runners are
    # retired, MP4Box will have to come from GPAC's own packages or a source
    # build instead.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MP4Box
        run: |
          sudo apt update
          sudo apt install -y gpac
      - name: Verify installation
        run: MP4Box -version
      - name: Run get_testing_files.sh
        run: ./get_testing_files.sh
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
